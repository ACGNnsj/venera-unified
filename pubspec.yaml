name: venera_unified
description: "A comic app."
publish_to: 'none'
homepage: https://github.com/ACGNnsj/venera-unified
version: 1.19.0+245

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: 3.47.8

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  intl: ^0.20.2
  window_manager: ^0.5.2
  sqlite3: ^3.8.0
  flutter_qjs:
    git:
      url: https://github.com/CyrilPeng/flutter_qjs
      ref: 8feae95df7fb00455df129ad7a0dfec1d0e8d8e4
  crypto: ^3.0.8
  dio: ^5.11.1
  html: ^0.15.7
  pointycastle: ^4.0.0
  url_launcher: ^6.3.3
  path: ^1.9.0
  photo_view:
    path: packages/photo_view
  mime: ^2.1.0
  share_plus:
    path: packages/share_plus
  scrollable_positioned_list:
    git:
      url: https://github.com/CyrilPeng/flutter.widgets
      ref: 09e756b1f1b04e6298318d99ec20a787fb360f59
      path: packages/scrollable_positioned_list
  flutter_reorderable_grid_view: ^5.7.0
  uuid: ^4.6.0
  desktop_webview_window:
    git:
      url: https://github.com/venera-app/flutter_desktop_webview
      path: packages/desktop_webview_window
      ref: 7801fc582ecf5a7351632887891ecf309a7b2583
  flutter_inappwebview:
    git:
      url: https://github.com/CyrilPeng/flutter_inappwebview
      path: flutter_inappwebview
      ref: 3ef899b3db57c911b080979f1392253b835f98ab
  app_links: ^7.2.1
  sliver_tools: ^0.2.12
  flutter_file_dialog: ^3.3.2
  file_selector: ^1.1.0
  zip_flutter: ^0.0.13
  lodepng_flutter:
    git:
      url: https://github.com/venera-app/lodepng_flutter
      ref: ac7d05dde32e8d728102a9ff66e6b55f05d94ba1
  rhttp:
    path: packages/rhttp
  flutter_rust_bridge: 2.11.1
  webdav_client:
    git:
      url: https://github.com/CyrilPeng/webdav_client
      ref: 2f669c98fb81cff1c64fee93466a1475c77e4273
  battery_plus: ^7.1.2
  local_auth: ^3.0.2
  flutter_saf:
    git:
      url: https://github.com/venera-app/flutter_saf
      ref: fe182cdf40e5fa6230f451bc1d643b860f610d13
  dynamic_color: ^2.1.0
  shimmer_animation: ^2.1.0
  flutter_memory_info: ^0.0.3
  syntax_highlight: ^0.5.0
  flutter_7zip:
    git:
      url: https://github.com/venera-app/flutter_7zip
      ref: b33344797f1d2469339e0e1b75f5f954f1da224c
  flex_seed_scheme: ^4.0.1
  flutter_localizations:
    sdk: flutter
  yaml: ^3.1.4
  enough_convert: ^1.7.1
  display_mode: ^0.0.2
  flutter_staggered_grid_view: ^0.7.0
  archive: ^4.5.2
  image: ^4.12.0
  pdfrx: ^2.4.8
  xml: ^6.6.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  tray_manager: ^0.8.0
  ffi: ^2.2.0
  # Native ONNX Runtime bundler for page translation (Dart bypasses its
  # channels via foundation/image_translation/ort_ffi.dart). Exact pin:
  # 1.9.0 ships ORT 1.28.x and requires iOS 16 (see task-41 report).
  flutter_onnxruntime: 1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_rust_bridge: 2.11.1

flutter:
  uses-material-design: true
  assets:
    - pubspec.yaml
    - CHANGELOG.md
    - assets/translation.json
    - assets/init.js
    - assets/app_icon.png
    - assets/tray_icon.ico
    - assets/tags.json
    - assets/tags_tw.json
    - assets/opencc.txt
    - assets/models/anime4k_acnet.onnx
    - assets/opencc/
    - assets/launcher_icon_default.png
    - assets/launcher_icon_purple.png
    - assets/launcher_icon_green.png
    - assets/launcher_icon_orange.png
    - assets/launcher_icon_silver.png
    - assets/launcher_icon_default.ico
    - assets/launcher_icon_purple.ico
    - assets/launcher_icon_green.ico
    - assets/launcher_icon_orange.ico
    - assets/launcher_icon_silver.ico
# fonts:

# Metadata consumed by .github/scripts/build_arch_package.py (no Dart package required).
flutter_to_arch:
  name: venera-unified
  icon: debian/gui/venera-unified.png
  categories: Utility
  keywords: Flutter;comic;images;
  url: https://github.com/ACGNnsj/venera-unified
  depends:
    - gtk3
    - webkit2gtk-4.1
