plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace = "com.github.cyrilpeng.veneranext"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "28.0.13004108"

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits{
        abi {
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            enable true
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions{
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "io.github.venera.unified"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    flavorDimensions += "device"
    productFlavors {
        mobile {
            dimension "device"
        }
        tv {
            dimension "device"
            applicationIdSuffix ".tv"
            // Keep upgrades above the retired Alpha sequence (100000 + run).
            versionCode = flutterVersionCode.toInteger() + 200000
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.release
        }
        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def platform = variant.flavorName == "tv" ? "android-tv" : "android"
            if (variant.buildType.name == "release") {
                if (abi != null) {
                    outputFileName = "VeneraUnified-${variant.versionName}-${platform}-${abi}.apk"
                    def abiVersionCode = project.ext.abiCodes.get(abi)
                    if (abiVersionCode != null) {
                        versionCodeOverride = variant.versionCode * 10 + abiVersionCode
                    }
                } else {
                    outputFileName = "VeneraUnified-${variant.versionName}-${platform}.apk"
                    versionCodeOverride = variant.versionCode * 10
                }
            } else if (variant.buildType.name == "debug") {
                versionCodeOverride = variant.versionCode * 10 + 4
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

flutter {
    source = "../.."
}

// ---------------------------------------------------------------------------
// 16 KB page sizes (required for Android 15+/16 and Play uploads).
// Every other native library we ship is already 16 KB aligned; the one that is
// not comes from org.opencv:opencv:4.11.0, whose AAR bundles a 4 KB-aligned
// libc++_shared.so. Drop that copy and ship the NDK r28 one instead, which is
// built with 16 KB ELF page alignment.
// ---------------------------------------------------------------------------
def ndkSysrootAbi = [
        'arm64-v8a'  : 'aarch64-linux-android',
        'armeabi-v7a': 'arm-linux-androideabi',
        'x86_64'     : 'x86_64-linux-android',
        'x86'        : 'i686-linux-android',
]
def ndkLibcxxRoot = new File(buildDir, 'ndk-libcxx')

def prepareNdkLibcxx = tasks.register('prepareNdkLibcxx') {
    outputs.dir(ndkLibcxxRoot)
    doLast {
        def prebuiltDir = new File(android.ndkDirectory, 'toolchains/llvm/prebuilt')
                .listFiles()
                .find { it.isDirectory() }
        if (prebuiltDir == null) {
            throw new GradleException("Cannot locate the NDK prebuilt toolchain under $android.ndkDirectory")
        }
        ndkSysrootAbi.each { abi, sysrootTriple ->
            def source = new File(prebuiltDir,
                    "sysroot/usr/lib/$sysrootTriple/libc++_shared.so")
            if (!source.isFile()) {
                throw new GradleException("Missing NDK libc++_shared.so for $abi at $source")
            }
            def target = new File(ndkLibcxxRoot, "$abi/libc++_shared.so")
            target.parentFile.mkdirs()
            target.bytes = source.bytes
        }
    }
}

android {
    sourceSets {
        main {
            jniLibs.srcDir ndkLibcxxRoot
        }
    }
    packaging {
        jniLibs {
            // Replaced by the NDK copy produced above.
            pickFirsts += '**/libc++_shared.so'
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') &&
            (task.name.endsWith('NativeLibs') || task.name.endsWith('JniLibFolders'))) {
        task.dependsOn prepareNdkLibcxx
    }
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.opencv:opencv:4.11.0'
    // flutter_onnxruntime 1.9.0 传递依赖 onnxruntime-android:1.28.0，Gradle 取高版本，
    // 这里必须跟它对齐，否则声明的版本会被静默顶掉（APK 里实际就是 1.28.0）。
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
}
