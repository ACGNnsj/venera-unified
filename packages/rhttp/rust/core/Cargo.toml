[package]
name = "rhttp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
chrono = "0.4.42"
futures-util = "0.3.31"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"

[dependencies.reqwest]
version = "0.12.25"
default-features = false
features = [
    "charset",
    "cookies",
    "http2",
    "http3",
    "rustls-tls-webpki-roots",
    "stream",
    "multipart",
    "socks",
    "brotli",
    "gzip",
]
