[package]
name = "rhttp-uniffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "rhttp_uniffi"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
rhttp-core = { path = "../core" }
uniffi = { version = "0.32.2", features = ["tokio"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.17"
chrono = "0.4.42"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["net", "io-util", "time"] }
