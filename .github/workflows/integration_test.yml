name: "集成测试（模拟器）"

# T4 pilot:只跑 integration_test/performance_lists_test.dart 一个 target。
# 跑法重（emulator 启动 + Rust x86_64 交叉编译），只在相关路径变动时触发。
# manifest 改动也触发：源码 manifest 决定 tool 能否发现 launch activity，
# 本 job 尾部断言 release 合并 manifest 单图标。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integration_test/**'
      - 'test/support/performance_lists_cases.dart'
      - 'lib/features/history/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/app/src/**/AndroidManifest.xml'
      - '.github/workflows/integration_test.yml'
  push:
    branches:
      - main
    paths:
      - 'integration_test/**'
      - 'test/support/performance_lists_cases.dart'
      - 'lib/features/history/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/app/src/**/AndroidManifest.xml'
      - '.github/workflows/integration_test.yml'

concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: 释放 Android 构建所需磁盘空间
        run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - name: 准备 Rust 工具链（模拟器 x86_64）
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target x86_64-linux-android
      - run: flutter pub get --enforce-lockfile
      # app/build.gradle 配置期无条件读 android/key.properties（CI 里没有该文件），
      # 且 debug 构建签名需要一个真实 keystore：现场生成临时 debug 证书。
      - name: 准备 debug 签名（CI 临时）
        run: |
          keytool -genkey -v -keystore /tmp/ci-debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -validity 365 \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=CN"
          printf 'storePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\nstoreFile=/tmp/ci-debug.keystore\n' > android/key.properties
      # android-emulator-runner 官方前置：runner 用户默认无 /dev/kvm 权限，
      # 无 KVM 时 x86_64 镜像回退 TCG 软模拟，API 34 一直起不来（device offline）。
      - name: 开放 KVM 给模拟器
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 模拟器跑 performance_lists
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: flutter test integration_test/performance_lists_test.dart
      # release 单图标回归保护：源码 manifest 里 MainActivity 的 MAIN/LAUNCHER
      # 只为 tool 发现而存在，必须被 src/release overlay 从 release 合并里摘掉。
      - name: 断言 release 合并 manifest 单图标
        run: |
          if [ -n "$ANDROID_SDK_ROOT" ]; then printf '\nsdk.dir=%s\n' "$ANDROID_SDK_ROOT" >> android/local.properties; fi
          (cd android && ./gradlew :app:processReleaseMainManifest -q)
          python3 .github/scripts/assert_release_launcher.py
