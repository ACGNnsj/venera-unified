name: "AVIF iOS 模拟器探测"

# iOS 只能跑在 macOS 上，本机是 Windows，所以放在 CI。
# 不用 `flutter test -d <simulator>`：Xcode build 完成后它会一直等 VM service 连接，
# 实测整 25 分钟无新日志（run 41214419620，Xcode build done 827s 之后卡死）。
# 改为 flutter build --simulator + simctl install/launch + 抓 console，输出六个 AVIF_PROBE 行。
# 手动 dispatch，不进 analyze 门禁（只 print 不断言）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-probe:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 准备 Rust 工具链
        # rhttp 的 cargokit 会在构建中隐式 rustup target add，Xcode 并行构建多个架构时
        # 会撞 rustup 下载竞态（could not rename 'downloaded' file ...），所以这里按
        # Build_IOS 的做法先装好目标，并在下一步把 rustup 换成串行化包装。
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-apple-ios-sim \
            --target aarch64-apple-ios \
            --target x86_64-apple-ios
      - name: 串行化 Rustup 安装操作
        run: |
          mkdir -p "$HOME/.cargo/bin"
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-rustup.lock" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: 启动 iOS 模拟器
        id: sim
        # 不能随便挑第一台 iPhone：iOS 18.5 运行时缺 /usr/lib/swift/libswiftWebKit.dylib，
        # flutter_inappwebview_ios 一启动就 dyld 崩（run 41217870742）。这里只选
        # runtimeRoot 里真带这个库的运行时，并按版本从高到低挑（实测 18.6 / 26.x 都有）。
        run: |
          set -euo pipefail
          # simctl 的 runtimes -j 不保证带 runtimeRoot，实测只能靠 bundlePath 拼
          # Contents/Resources/RuntimeRoot；两条路都试，避免又把候选过滤成空。
          python3 - <<'PY' > /tmp/sim-choice.txt 2>/tmp/sim-choice.err
          import json, os, subprocess

          def simctl(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", *args, "-j"]))

          def runtime_root(rt):
              candidates = [rt.get("runtimeRoot")]
              bundle = rt.get("bundlePath")
              if bundle:
                  candidates.append(os.path.join(bundle, "Contents/Resources/RuntimeRoot"))
              for c in candidates:
                  if c and os.path.isdir(c):
                      return c
              return ""

          runtimes = simctl("list", "runtimes")["runtimes"]
          def has_dylib(rt):
              root = runtime_root(rt)
              return bool(root) and os.path.exists(
                  os.path.join(root, "usr/lib/swift/libswiftWebKit.dylib"))

          for rt in runtimes:
              print(rt.get("name"), rt.get("isAvailable"), runtime_root(rt), has_dylib(rt),
                    file=os.sys.stderr)

          usable = [r for r in runtimes
                    if r.get("isAvailable") and r.get("platform") == "iOS" and has_dylib(r)]
          if not usable:
              raise SystemExit("没有自带 libswiftWebKit.dylib 的可用 iOS 运行时")

          def version_key(rt):
              return tuple(int(p) for p in rt["version"].split(".") if p.isdigit())

          chosen = max(usable, key=version_key)
          devicetypes = simctl("list", "devicetypes")["devicetypes"]
          device_type = next(d["identifier"] for d in devicetypes if "iPhone" in d["identifier"])
          print(chosen["identifier"])
          print(device_type)
          print(chosen["name"])
          PY
          if [ ! -s /tmp/sim-choice.txt ]; then
            echo "::error::没能选出带 libswiftWebKit 的 iOS 运行时"
            cat /tmp/sim-choice.err
            exit 1
          fi
          cat /tmp/sim-choice.err
          RUNTIME=$(sed -n 1p /tmp/sim-choice.txt)
          DEVTYPE=$(sed -n 2p /tmp/sim-choice.txt)
          echo "选中运行时：$(sed -n 3p /tmp/sim-choice.txt)（$RUNTIME）"
          UDID=$(xcrun simctl create AVIFProbe "$DEVTYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: 构建模拟器包
        # 入口必须指向 integration_test 文件：这样 App 启动就会跑探针，
        # 打印走 stdout，由下一步的 simctl launch --console-pty 收回来。
        run: |
          flutter build ios --simulator --debug \
            --target integration_test/avif_codec_probe_test.dart 2>&1 | tee build.log
      - name: 安装并运行探针
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP=build/ios/iphonesimulator/Runner.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl terminate "$UDID" io.github.venera.unified || true
          ( xcrun simctl launch --console-pty "$UDID" io.github.venera.unified \
              > console.log 2>&1 ) &
          PID=$!
          for i in $(seq 1 90); do
            if grep -aq 'AVIF_PROBE' console.log && [ "$(grep -ac 'AVIF_PROBE' console.log)" -ge 6 ]; then
              echo "已收到 6 个样本结果"
              break
            fi
            sleep 2
          done
          sleep 3
          kill "$PID" 2>/dev/null || true
          xcrun simctl terminate "$UDID" io.github.venera.unified || true
          echo '--- console ---'
          cat console.log || true
          # 假绿防线：拿不到 6 个样本就让 job 变红，别让崩掉的 app 冒充成功。
          COUNT=$(grep -ac 'AVIF_PROBE' console.log || true)
          echo "AVIF_PROBE 行数：$COUNT"
          if [ "$COUNT" -lt 6 ]; then
            echo "::error::未收到 6 个 AVIF 样本结果（实际 $COUNT）"
            exit 1
          fi
      - name: 保存日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: avif-ios-probe-log
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
