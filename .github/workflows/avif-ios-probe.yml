name: "AVIF iOS 模拟器探测"

# 跑 integration_test/avif_codec_probe_test.dart 在 iOS 模拟器上，输出六个样本的
# AVIF_PROBE JSON。iOS 只能在 macOS 上跑，本机是 Windows，所以放在 CI。
# 手动 dispatch，不进 analyze 门禁（只 print 不断言）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-probe:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 启动 iOS 模拟器
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available | sed -n '1,40p'
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for sims in d.values() for x in sims if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: 设备侧 AVIF 探测（iOS 模拟器）
        run: flutter test integration_test/avif_codec_probe_test.dart -d ${{ steps.sim.outputs.udid }}
      - name: 保存日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: avif-ios-probe-log
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
