name: "AVIF iOS 模拟器探测"

# iOS 只能跑在 macOS 上，本机是 Windows，所以放在 CI。
# 不用 `flutter test -d <simulator>`：Xcode build 完成后它会一直等 VM service 连接，
# 实测整 25 分钟无新日志（run 41214419620，Xcode build done 827s 之后卡死）。
# 改为 flutter build --simulator + simctl install/launch + 抓 console，输出六个 AVIF_PROBE 行。
# 手动 dispatch，不进 analyze 门禁（只 print 不断言）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-probe:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 准备 Rust 工具链
        # rhttp 的 cargokit 会在构建中隐式 rustup target add，Xcode 并行构建多个架构时
        # 会撞 rustup 下载竞态（could not rename 'downloaded' file ...），所以这里按
        # Build_IOS 的做法先装好目标，并在下一步把 rustup 换成串行化包装。
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-apple-ios-sim \
            --target aarch64-apple-ios \
            --target x86_64-apple-ios
      - name: 串行化 Rustup 安装操作
        run: |
          mkdir -p "$HOME/.cargo/bin"
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-rustup.lock" >> "$GITHUB_ENV"
      - name: 启动 iOS 模拟器
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for sims in d.values() for x in sims if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: 构建模拟器包
        # 入口必须指向 integration_test 文件：这样 App 启动就会跑探针，
        # 打印走 stdout，由下一步的 simctl launch --console-pty 收回来。
        run: |
          flutter build ios --simulator --debug \
            --target integration_test/avif_codec_probe_test.dart 2>&1 | tee build.log
      - name: 安装并运行探针
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP=build/ios/iphonesimulator/Runner.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl terminate "$UDID" io.github.venera.unified || true
          ( xcrun simctl launch --console-pty "$UDID" io.github.venera.unified \
              > console.log 2>&1 ) &
          PID=$!
          for i in $(seq 1 90); do
            if grep -aq 'AVIF_PROBE' console.log && [ "$(grep -ac 'AVIF_PROBE' console.log)" -ge 6 ]; then
              echo "已收到 6 个样本结果"
              break
            fi
            sleep 2
          done
          sleep 3
          kill "$PID" 2>/dev/null || true
          xcrun simctl terminate "$UDID" io.github.venera.unified || true
          echo '--- console ---'
          cat console.log || true
      - name: 保存日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: avif-ios-probe-log
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
