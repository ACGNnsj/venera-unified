name: Microsoft Store 发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "稳定版发布标签，例如 v1.21.0（只要 .msixupload，预发布拒绝）"
        required: true
        type: string
      dry_run:
        description: "只验证凭据与应用列表，不提交认证（第一次先跑这个）"
        required: false
        type: boolean
        default: true

concurrency:
  group: msstore-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Windows 跑：CLI 的凭据走 Windows 凭据管理器，Linux runner 要额外起
    # dbus + gnome-keyring 才能用 libsecret，CI 里没必要。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 校验只要稳定版
        shell: bash
        run: |
          if [[ "${{ inputs.tag }}" != v* || "${{ inputs.tag }}" == *-* ]]; then
            echo "::error::只要稳定版 tag（vX.Y.Z），预发布不上商店"
            exit 1
          fi
      - name: 下载 msixupload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "*.msixupload" --dir pkg
          Get-ChildItem pkg
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: 安装 msstore CLI
        shell: pwsh
        run: |
          $zip = 'MSStoreCLI-win-x64.zip'
          $base = 'https://github.com/microsoft/msstore-cli/releases/download/v0.4.4'
          Invoke-WebRequest -UseBasicParsing "$base/$zip" -OutFile $zip
          $raw = (Invoke-WebRequest -UseBasicParsing "$base/$zip.sha256.txt").Content
          $text = [Text.Encoding]::Unicode.GetString($raw)
          $expected = ([regex]'[0-9a-f]{64}').Match($text).Value
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "checksum mismatch: $expected vs $actual" }
          Expand-Archive $zip -DestinationPath msstore -Force
          $exe = Get-ChildItem -Path msstore -Recurse -Filter 'msstore.exe' | Select-Object -First 1
          if (-not $exe) { throw 'msstore.exe not found in the archive' }
          $exe.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: 验证凭据与应用列表
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId "$env:MSSTORE_TENANT_ID" --sellerId "$env:MSSTORE_SELLER_ID" --clientId "$env:MSSTORE_CLIENT_ID" --clientSecret "$env:MSSTORE_CLIENT_SECRET"
          if ($LASTEXITCODE -ne 0) { throw "reconfigure failed with exit code $LASTEXITCODE" }
          # apps list 只列 API 视角的「托管应用」，本账号返回空是正常的；
          # 直接按 Store ID 取一次提交，能拿到 JSON 说明凭据与权限都通。
          $out = msstore submission get 9PPRKVBR61W9 --verbose 2>&1 | Out-String
          Write-Host "SUBMISSION_OUTPUT_START"
          Write-Host $out
          Write-Host "SUBMISSION_OUTPUT_END"
          if ($LASTEXITCODE -ne 0) { throw "submission get failed with exit code $LASTEXITCODE" }
      - name: 发布到商店
        if: ${{ inputs.dry_run == false }}
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId "$env:MSSTORE_TENANT_ID" --sellerId "$env:MSSTORE_SELLER_ID" --clientId "$env:MSSTORE_CLIENT_ID" --clientSecret "$env:MSSTORE_CLIENT_SECRET"
          if ($LASTEXITCODE -ne 0) { throw "reconfigure failed with exit code $LASTEXITCODE" }
          $pkg = (Get-ChildItem pkg -Filter '*.msixupload').FullName
          msstore publish .\pkg --inputFile "$pkg" --appId 9PPRKVBR61W9
          if ($LASTEXITCODE -ne 0) { throw "publish failed with exit code $LASTEXITCODE" }