name: Microsoft Store 发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "稳定版发布标签，例如 v1.20.0（只要 .msixupload，预发布拒绝）"
        required: true
        type: string
      dry_run:
        description: "只验证凭据与权限，不提交认证（先跑一次这个）"
        required: false
        type: boolean
        default: true

concurrency:
  group: msstore-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 校验只要稳定版
        run: |
          if [[ "${{ inputs.tag }}" != v* || "${{ inputs.tag }}" == *-* ]]; then
            echo "::error::只要稳定版 tag（vX.Y.Z），预发布不上商店"
            exit 1
          fi
      - name: 下载 msixupload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pkg
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "*.msixupload" --dir pkg
          ls pkg
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: 安装 msstore CLI
        run: |
          curl -sL -o msstore.tar.gz https://github.com/microsoft/msstore-cli/releases/download/v0.4.4/MSStoreCLI-linux-x64.tar.gz
          expected=$(curl -sL https://github.com/microsoft/msstore-cli/releases/download/v0.4.4/MSStoreCLI-linux-x64.tar.gz.sha256.txt | iconv -f UTF-16LE -t UTF-8 | grep -oE "[0-9a-f]{64}" | head -1)
          actual=$(sha256sum msstore.tar.gz | grep -oE "^[0-9a-f]{64}")
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::msstore CLI 校验失败 expected=$expected actual=$actual"
            exit 1
          fi
          mkdir -p msstore && tar xzf msstore.tar.gz -C msstore
          echo "$PWD/msstore" >> "$GITHUB_PATH"
      - name: 验证凭据与应用列表
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId "$MSSTORE_TENANT_ID" --sellerId "$MSSTORE_SELLER_ID" --clientId "$MSSTORE_CLIENT_ID" --clientSecret "$MSSTORE_CLIENT_SECRET"
          msstore apps list --output-stream stdout
      - name: 发布到商店
        if: ${{ inputs.dry_run == false }}
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId "$MSSTORE_TENANT_ID" --sellerId "$MSSTORE_SELLER_ID" --clientId "$MSSTORE_CLIENT_ID" --clientSecret "$MSSTORE_CLIENT_SECRET"
          msstore publish ./pkg --inputFile pkg/*.msixupload --appId 9PPRKVBR61W9