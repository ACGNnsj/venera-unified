name: 构建
run-name: 构建 ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      quality_checked:
        description: '调用方已经通过同一质量检查，仅供复用工作流使用'
        required: false
        type: boolean
        default: false
      build_android:
        required: false
        type: boolean
        default: true
      build_windows:
        required: false
        type: boolean
        default: true
      build_macos:
        required: false
        type: boolean
        default: true
      build_ios:
        required: false
        type: boolean
        default: false
      build_linux_x64:
        required: false
        type: boolean
        default: true
      build_linux_arm64:
        required: false
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEY_PROPERTIES:
        required: false
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android'
        required: true
        type: boolean
        default: true
      build_windows:
        description: '构建 Windows'
        required: true
        type: boolean
        default: true
      build_macos:
        description: '构建 macOS'
        required: true
        type: boolean
        default: true
      build_ios:
        description: '构建 iOS'
        required: true
        type: boolean
        default: false
      build_linux_x64:
        description: '构建 Linux x64'
        required: true
        type: boolean
        default: true
      build_linux_arm64:
        description: '构建 Linux ARM64'
        required: true
        type: boolean
        default: true

concurrency:
  group: build-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Manual_Quality:
    if: ${{ inputs.build_android && !inputs.quality_checked }}
    uses: ./.github/workflows/analyze.yml

  Build_Android:
    needs: Manual_Quality
    if: ${{ !cancelled() && inputs.build_android && (needs.Manual_Quality.result == 'success' || needs.Manual_Quality.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [mobile, tv]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: 生成并复核 Android 构建身份
        id: profile
        env:
          ANDROID_FLAVOR: ${{ matrix.flavor }}
        run: python3 .github/scripts/android_tv_build.py metadata --flavor "$ANDROID_FLAVOR" --github-output "$GITHUB_OUTPUT"
      - name: 释放 Android 构建所需磁盘空间
        run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 解码并安装 Android 证书
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$STORE_FILE" | base64 --decode > android/keystore.jks
          echo "$PROPERTY_FILE" > android/key.properties
      - uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android
      - name: 配置 Gradle 插件仓库
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/plugin-repositories.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF
      - name: 检查 rust-toolchain.toml
        run: rustup show
      - run: flutter pub get --enforce-lockfile
      - name: 构建隔离的 Android 安装包
        env:
          ANDROID_FLAVOR: ${{ steps.profile.outputs.flavor }}
          TV_BUILD_LABEL: ${{ steps.profile.outputs.build_label }}
          TV_REVISION: ${{ github.sha }}
        run: |
          if [[ "$ANDROID_FLAVOR" == "tv" ]]; then
            flutter build apk --release --flavor tv \
              --dart-define="TV_BUILD=$TV_BUILD_LABEL" \
              --dart-define="TV_REVISION=$TV_REVISION"
          else
            flutter build apk --release --flavor mobile
          fi
      - name: 验证 Android 分享文件与回调归属
        working-directory: android
        run: ./gradlew :share_plus:testShareOwnership
      - name: 检查 APK 渠道、电视入口、版本码、签名与 ABI
        id: apks
        run: python3 .github/scripts/android_tv_build.py verify --github-output "$GITHUB_OUTPUT"
      - name: 上传 APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor == 'tv' && 'tv-apk-armeabi-v7a' || 'apk-armeabi-v7a' }}
          path: ${{ steps.apks.outputs.apk_armeabi_v7a }}
          if-no-files-found: error
          retention-days: 7
      - name: 上传 APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor == 'tv' && 'tv-apk-arm64-v8a' || 'apk-arm64-v8a' }}
          path: ${{ steps.apks.outputs.apk_arm64_v8a }}
          if-no-files-found: error
          retention-days: 7
      - name: 上传 APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor == 'tv' && 'tv-apk-x86_64' || 'apk-x86_64' }}
          path: ${{ steps.apks.outputs.apk_x86_64 }}
          if-no-files-found: error
          retention-days: 7
      - name: 上传 APK (universal)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor == 'tv' && 'tv-apk-universal' || 'apk-universal' }}
          path: ${{ steps.apks.outputs.apk_universal }}
          if-no-files-found: error
          retention-days: 7
      - name: 上传 Android 构建来源与校验清单
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.flavor }}-manifest
          path: ${{ steps.apks.outputs.manifest }}
          if-no-files-found: error
          retention-days: 7

  Build_Windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      # 增量编译缓存：MSVC 目标文件在 build/windows（约 1.7 GB），原生依赖产物在
      # .dart_tool/hooks_runner（约 300 MB，rhttp/7zip/pdfium）。Dart 的
      # .dart_tool/flutter_build 有 3 GB 以上，不进缓存。命中后 Windows 构建从约
      # 21 分钟降到 10 分钟以内；key 不中会退到 restore-keys 拿最近一份，仍能增量。
      # 缓存超过仓库 10 GB 上限时 GitHub 自动淘汰最旧条目。
      - name: 缓存 Windows 增量构建产物
        uses: actions/cache@v6
        with:
          path: |
            build/windows
            .dart_tool/hooks_runner
          key: windows-build-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'windows/**', 'packages/**') }}
          restore-keys: |
            windows-build-${{ runner.os }}-
      # 缓存里带着上一次打包留下的安装包；版本一变就会和本次产物同时命中
      # 下面的产物校验（曾因此报「应当恰好生成一个 Windows zip，实际为 2」）。
      - name: 清理缓存里的旧安装包
        shell: pwsh
        run: |
          $patterns = @(
            'VeneraUnified-*-windows.zip',
            'VeneraUnified-*-windows-installer.exe',
            'VeneraUnified-*-windows.msix',
            'VeneraUnified-*-windows.msixbundle',
            'VeneraUnified-*-windows.msixupload'
          )
          foreach ($pattern in $patterns) {
            Remove-Item -Path "build/windows/$pattern" -Force -ErrorAction SilentlyContinue
          }
      - name: 准备 Rust 工具链
        run: python .github/scripts/prepare_rust_toolchain.py
      - name: 构建 Windows 安装包
        env:
          # 仓库变量为空时 build.py 回落到侧载默认身份；提交商店前在仓库
          # Settings → Secrets and variables → Actions → Variables 里填
          # Partner Center 分配的值。
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          flutter pub get --enforce-lockfile
          python windows/build.py
      - name: 验证 Windows 分享请求与 COM 归属
        shell: pwsh
        run: |
          cmake -S packages/share_plus/windows/tests -B build/share-plus-tests -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/share-plus-tests --config Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/share-plus-tests -C Debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 校验 Windows 构建产物
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraUnified-*-windows.zip')
          $installer = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraUnified-*-windows-installer.exe')
          $msix = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraUnified-*-windows.msix')
          $bundle = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraUnified-*-windows.msixbundle')
          $upload = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraUnified-*-windows.msixupload')
          if ($zip.Count -ne 1) { throw "应当恰好生成一个 Windows zip，实际为 $($zip.Count)。" }
          if ($installer.Count -ne 1) { throw "应当恰好生成一个 Windows 安装包，实际为 $($installer.Count)。" }
          if ($msix.Count -ne 1) { throw "应当恰好生成一个 MSIX，实际为 $($msix.Count)。" }
          if ($bundle.Count -ne 1) { throw "应当恰好生成一个 .msixbundle，实际为 $($bundle.Count)。" }
          if ($upload.Count -ne 1) { throw "应当恰好生成一个 .msixupload，实际为 $($upload.Count)。" }
          $artifacts = @($zip + $installer + $msix + $bundle + $upload)
          $empty = @($artifacts | Where-Object { $_.Length -le 0 })
          if ($empty.Count -gt 0) {
            throw "Windows 构建产物包含空文件：$($empty.Name -join ', ')"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expectedRoot = [System.IO.Path]::GetFileNameWithoutExtension($zip[0].Name)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip[0].FullName)
          try {
            $badEntries = @($archive.Entries | Where-Object {
              -not $_.FullName.StartsWith("$expectedRoot/") -and $_.FullName -ne "$expectedRoot/"
            })
            if ($badEntries.Count -gt 0) {
              throw "Windows zip 包含 $expectedRoot/ 之外的文件：$($badEntries.FullName -join ', ')"
            }
            $exeEntry = @($archive.Entries | Where-Object { $_.FullName -eq "$expectedRoot/VeneraUnified.exe" })
            if ($exeEntry.Count -ne 1) {
              throw "Windows zip 未包含 $expectedRoot/VeneraUnified.exe"
            }
          } finally {
            $archive.Dispose()
          }
          $msixArchive = [System.IO.Compression.ZipFile]::OpenRead($msix[0].FullName)
          try {
            # MakeAppx 的分隔符可能是反斜杠，统一成正斜杠再比对
            $msixEntries = @($msixArchive.Entries.FullName | ForEach-Object { $_ -replace '\\', '/' })
            foreach ($required in @('AppxManifest.xml', 'VeneraUnified.exe', 'Assets/Square150x150Logo.png', 'Assets/StoreLogo.png')) {
              if ($msixEntries -notcontains $required) { throw "MSIX 缺少 $required" }
            }
            $manifestStream = $msixArchive.GetEntry('AppxManifest.xml').Open()
            try {
              $manifestXml = [xml](New-Object System.IO.StreamReader($manifestStream)).ReadToEnd()
            } finally {
              $manifestStream.Dispose()
            }
            $identity = $manifestXml.Package.Identity
            if (-not $identity.Name -or -not $identity.Publisher -or -not $identity.Version) {
              throw 'MSIX 清单 Identity 缺 Name/Publisher/Version。'
            }
            if ($identity.Version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw "MSIX 版本不是四段号：$($identity.Version)"
            }
            # 商店硬性要求修订号为 0，不为 0 上传会被拒，这里提前拦住。
            if ($identity.Version -notmatch '\.0$') {
              throw "MSIX 版本修订号必须为 0（商店要求），实际为 $($identity.Version)"
            }
            if ($identity.ProcessorArchitecture -ne 'x64') {
              throw "MSIX 架构应为 x64，实际为 $($identity.ProcessorArchitecture)。"
            }
            $app = $manifestXml.Package.Applications.Application
            if ($app.Executable -ne 'VeneraUnified.exe') { throw "MSIX 入口可执行名不是 VeneraUnified.exe：$($app.Executable)" }
            "MSIX 身份：$($identity.Name) / $($identity.Version) / $($identity.ProcessorArchitecture)"
          } finally {
            $msixArchive.Dispose()
          }
          $uploadArchive = [System.IO.Compression.ZipFile]::OpenRead($upload[0].FullName)
          try {
            $uploadEntries = @($uploadArchive.Entries.FullName | ForEach-Object { $_ -replace '\\', '/' })
            # 上传文件是一个 zip，里面只该有 .msixbundle（可再加符号包）。若把
            # bundle 自己的清单等文件摆在最外层，商店会判成「不受支持的文件」拒收。
            $unexpected = @($uploadEntries | Where-Object { $_ -notlike '*.msixbundle' -and $_ -notlike '*.msixsym' })
            if ($unexpected.Count -gt 0) {
              throw ".msixupload 含有不该出现的条目：$($unexpected -join ', ')"
            }
            $innerBundle = @($uploadArchive.Entries | Where-Object { ($_.FullName -replace '\\', '/') -like '*.msixbundle' })
            if ($innerBundle.Count -ne 1) { throw ".msixupload 应当恰好含一个 .msixbundle，实际为 $($innerBundle.Count)。" }
            # 清单在 bundle 里面，不在上传包根目录：先落盘再按 zip 打开内层 bundle。
            $tempBundle = Join-Path ([System.IO.Path]::GetTempPath()) $innerBundle[0].Name
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($innerBundle[0], $tempBundle, $true)
            try {
              $bundleArchive = [System.IO.Compression.ZipFile]::OpenRead($tempBundle)
              try {
                $bundleEntries = @($bundleArchive.Entries.FullName | ForEach-Object { $_ -replace '\\', '/' })
                # 清单位置随 SDK 变（根目录或 AppxMetadata/），按后缀匹配，别写死目录。
                $bundleManifests = @($bundleEntries | Where-Object { $_ -like '*AppxBundleManifest.xml' })
                if ($bundleManifests.Count -ne 1) {
                  throw ".msixbundle 应当恰好含一个 AppxBundleManifest.xml，实际为 $($bundleManifests.Count)。条目：$($bundleEntries -join ', ')"
                }
                $innerMsix = @($bundleEntries | Where-Object { $_ -like '*.msix' })
                if ($innerMsix.Count -ne 1) { throw ".msixbundle 应当恰好含一个 .msix，实际为 $($innerMsix.Count)。" }
                $bundleManifestStream = $bundleArchive.GetEntry($bundleManifests[0]).Open()
                try {
                  $bundleXml = [xml](New-Object System.IO.StreamReader($bundleManifestStream)).ReadToEnd()
                } finally {
                  $bundleManifestStream.Dispose()
                }
                $bundlePackage = @($bundleXml.Bundle.Packages.Package)[0]
                if (-not $bundlePackage) { throw 'AppxBundleManifest.xml 缺 Packages/Package。' }
                if ($bundlePackage.FileName -ne $innerMsix[0]) {
                  throw "bundle 清单指向的包与内层 .msix 不一致：$($bundlePackage.FileName) / $($innerMsix[0])"
                }
                if ($bundlePackage.Version -ne $identity.Version) {
                  throw "bundle 内 .msix 版本与已校验的 MSIX 不一致：$($bundlePackage.Version) / $($identity.Version)"
                }
                if ($bundlePackage.Architecture -ne 'x64') {
                  throw "bundle 内 .msix 架构应为 x64，实际为 $($bundlePackage.Architecture)。"
                }
                ".msixupload 内含：$($innerMsix[0])，清单：$($bundleManifests[0])"
              } finally {
                $bundleArchive.Dispose()
              }
            } finally {
              Remove-Item -LiteralPath $tempBundle -Force -ErrorAction SilentlyContinue
            }
          } finally {
            $uploadArchive.Dispose()
          }
          $artifacts | Sort-Object Name | ForEach-Object { "$($_.Name) $($_.Length) bytes" }
      - name: 编译并运行 Windows 原生启动测试
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S windows/tests -B build/windows/startup_tests -A x64
          cmake --build build/windows/startup_tests --config Release
          ctest --test-dir build/windows/startup_tests -C Release --output-on-failure
      - name: 验证 Windows 安装、无头命令与实际启动
        shell: pwsh
        timeout-minutes: 12
        run: |
          $installers = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraUnified-*-windows-installer.exe')
          if ($installers.Count -ne 1) { throw '静默安装测试需要恰好一个安装包。' }
          ./.github/scripts/test_windows_startup.ps1 -Installer $installers[0].FullName
      - name: 上传 Windows 启动诊断
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-startup-logs
          path: build/windows/startup-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: windows_build
          path: |
            build/windows/VeneraUnified-*-windows.zip
            build/windows/VeneraUnified-*-windows-installer.exe
            build/windows/VeneraUnified-*-windows.msix
            build/windows/VeneraUnified-*-windows.msixbundle
            build/windows/VeneraUnified-*-windows.msixupload
          if-no-files-found: error
          retention-days: 7

  Build_MacOS:
    if: ${{ inputs.build_macos }}
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app || sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin
      - name: 串行化 Rustup 安装操作
        run: |
          mkdir -p "$HOME/.cargo/bin"
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-rustup.lock" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: 检查 rust-toolchain.toml
        run: rustup show
      - name: 构建 Flutter macOS 应用
        run: flutter build macos --release
      - name: 构建 venera 原生库并装入 Frameworks
        run: |
          app_path=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo "::error::未找到 .app 产物"
            exit 1
          fi
          python3 .github/scripts/build_venera_native.py macos --out "$app_path/Contents/Frameworks"
      - name: 创建 DMG
        run: |
          mkdir -p dist
          mkdir -p dist/dmg_contents
          app_path=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo "::error::未在 build/macos/Build/Products/Release 找到 .app 产物"
            exit 1
          fi
          echo "打包 $(basename "$app_path")"
          cp -R "$app_path" dist/dmg_contents/
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create -volname "Venera Unified" -srcfolder dist/dmg_contents -ov -format UDZO "dist/VeneraUnified.dmg"
      - name: 将版本号写入文件名
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          mkdir -p result
          mv dist/VeneraUnified.dmg "result/VeneraUnified-$APP_VERSION.dmg"
      - name: 上传 DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos_build
          path: result/
          if-no-files-found: error
          retention-days: 7

  Build_IOS:
    if: ${{ inputs.build_ios }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin \
            --target aarch64-apple-ios
      - name: 串行化 Rustup 安装操作
        run: |
          mkdir -p "$HOME/.cargo/bin"
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-rustup.lock" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: 构建 venera 静态库
        run: python3 .github/scripts/build_venera_native.py ios --out ios/VeneraNativeLibs
      - name: 构建 iOS 应用
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          IOS_VERSION="${APP_VERSION%%+*}"
          IOS_BUILD="${APP_VERSION#*+}"
          if [ "$IOS_BUILD" = "$APP_VERSION" ]; then
            IOS_BUILD=1
          fi
          IOS_VERSION="${IOS_VERSION%%-*}"
          echo "正在根据 ${APP_VERSION} 构建 iOS 包版本 ${IOS_VERSION}+${IOS_BUILD}"
          flutter build ios --release --no-codesign \
            --build-name "$IOS_VERSION" --build-number "$IOS_BUILD"
      - name: 校验 iOS 原生版本与应用更新渠道
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          IOS_VERSION="${APP_VERSION%%+*}"
          IOS_BUILD="${APP_VERSION#*+}"
          IOS_VERSION="${IOS_VERSION%%-*}"
          APP_BUNDLE="build/ios/iphoneos/Runner.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Info.plist")" = "$IOS_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_BUNDLE/Info.plist")" = "$IOS_BUILD"
          BUNDLED_VERSION=$(sed -n 's/^version:[[:space:]]*//p' "$APP_BUNDLE/Frameworks/App.framework/flutter_assets/pubspec.yaml" | tr -d '\r\n')
          test "$BUNDLED_VERSION" = "$APP_VERSION"
      - name: 创建 IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos/
          zip -r VeneraUnified-ios.ipa Payload
      - name: 将版本号写入文件名
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          mkdir -p result
          mv build/ios/iphoneos/VeneraUnified-ios.ipa "result/VeneraUnified-ios-$APP_VERSION.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: ios_build
          path: result/
          if-no-files-found: error
          retention-days: 7
      - name: 归档 dSYM
        run: |
          set -euo pipefail
          mkdir -p dsym
          find build/ios -maxdepth 2 -name '*.dSYM' -exec cp -R {} dsym/ \;
          ls -1 dsym
      - uses: actions/upload-artifact@v7
        with:
          name: ios_dsyms
          path: dsym/
          # dSYM 缺失时不让发版失败，但会在产物里留下空目录提示：
          # 之后用 symbolicate_ios.yml 校验配对时能立刻发现。
          if-no-files-found: warn
          retention-days: 30

  Build_Linux_x64:
    if: ${{ inputs.build_linux_x64 }}
    # 24.04 ships libavif16, which the reader's Linux AVIF fallback loads and the
    # AppImage bundles. Building on 22.04 would force a source build of libavif.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 准备 Rust 工具链
        run: python3 .github/scripts/prepare_rust_toolchain.py
      - run: flutter pub get --enforce-lockfile
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev webkit2gtk-4.1 libwebkit2gtk-4.1-dev libgdk-pixbuf2.0-bin librsvg2-common glib-networking gstreamer1.0-plugins-base gstreamer1.0-plugins-good gsettings-desktop-schemas shared-mime-info adwaita-icon-theme fontconfig-config bubblewrap xdg-dbus-proxy rpm squashfs-tools desktop-file-utils file libavif16
      - run: python3 debian/build.py x64
      - name: 构建 RPM 和 AppImage
        run: python3 .github/scripts/build_linux_packages.py --arch x64
      - name: 在无 GTK 和 WebKit 的容器中验证 AppImage
        run: bash .github/scripts/test_appimage.sh x64
      - uses: actions/upload-artifact@v7
        with:
          name: linux_extra_x64
          path: |
            build/linux/x64/packages/*.rpm
            build/linux/x64/packages/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: 构建 Arch 软件包
        run: python3 .github/scripts/build_arch_package.py
      - name: 移除 Arch 调试包
        run: rm -f build/linux/arch/*-debug-*.pkg.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: deb_build
          path: build/linux/x64/release/debian
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: arch_build
          path: build/linux/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  Build_Linux_ARM64:
    if: ${{ inputs.build_linux_arm64 }}
    # See Build_Linux_x64: 24.04 provides libavif16 for bundling and Depends.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Flutter does not publish Linux ARM64 SDK archives. Clone the pinned
          # version from Git and let Flutter bootstrap artifacts for this host.
          channel: 'master'
          flutter-version-file: pubspec.yaml
          cache: true
      - name: 准备 Rust 工具链
        run: python3 .github/scripts/prepare_rust_toolchain.py
      # ARM runner 上 github.com 的 git 依赖克隆会偶发中断（Git error, exit 69），
      # 于是把 pub get 包成重试：失败就清掉 git 依赖的裸镜像再来一次。
      # 2026-11-09 起 webdav_client 已改为本地包，剩下的四个 git 依赖仍走这条路。
      - name: 拉取依赖
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if flutter pub get --enforce-lockfile; then
              exit 0
            fi
            echo "::warning::flutter pub get 第 $attempt 次失败，清理 git 依赖缓存后重试"
            rm -rf "$HOME/.pub-cache/_temp" "$HOME/.pub-cache/git/cache"
            sleep 20
          done
          echo "::error::flutter pub get 连续 4 次失败"
          exit 1
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev webkit2gtk-4.1 libwebkit2gtk-4.1-dev libgdk-pixbuf2.0-bin librsvg2-common glib-networking gstreamer1.0-plugins-base gstreamer1.0-plugins-good gsettings-desktop-schemas shared-mime-info adwaita-icon-theme fontconfig-config bubblewrap xdg-dbus-proxy rpm squashfs-tools desktop-file-utils file libavif16
      - name: 修补字体
        run: dart run patch/font.dart
      - run: python3 debian/build.py arm64
      - name: 构建 RPM 和 AppImage
        run: python3 .github/scripts/build_linux_packages.py --arch arm64
      - name: 在无 GTK 和 WebKit 的容器中验证 AppImage
        run: bash .github/scripts/test_appimage.sh arm64
      - uses: actions/upload-artifact@v7
        with:
          name: linux_extra_arm64
          path: |
            build/linux/arm64/packages/*.rpm
            build/linux/arm64/packages/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: deb_arm64_build
          path: build/linux/arm64/release/debian
          if-no-files-found: error
          retention-days: 7
