name: "AVIF 宿主探测（Linux / macOS）"

# 只跑 tool/avif_codec_probe.dart：把四个 libavif 样本丢给宿主引擎，逐行打印 JSON。
# 只 print 不断言，所以手动 dispatch，不进 analyze 门禁。
# Windows 与 Android 模拟器的数据已分别来自本机与 integration_test.yml。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 宿主 AVIF 探测
        run: flutter test --no-pub tool/avif_codec_probe.dart
