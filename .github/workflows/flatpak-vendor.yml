name: Flatpak 离线依赖归档

# 发版后跑一次：把 pub-cache / 引擎产物 / cargo vendor 三份归档算好 sha256、
# 渲染出可用的 Flatpak manifest，并把它们挂到对应 Release 资产上。
# 产物是 flatpak-build.yml 的输入。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已发布的标签，例如 v1.20.0"
        required: true
        type: string
      ref:
        description: "取脚本与模板的分支或提交，留空用 main；依赖树一律按 tag 取"
        required: false
        default: ""
        type: string
      upload_to_release:
        description: "把归档与 manifest 传到该 Release"
        required: false
        default: true
        type: boolean

concurrency:
  group: flatpak-vendor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: 校验渲染脚本存在
        run: |
          test -f .github/scripts/render_flatpak_manifest.py || {
            echo "::error::取脚本的提交里没有 .github/scripts/render_flatpak_manifest.py"
            exit 1
          }
      # 依赖树必须来自发布标签本身：pub 缓存与 cargo vendor 只装被解析到的那几个版本，
      # 拿 main 的缓存去装旧标签会在离线沙箱里解析出别的版本。
      - name: 取发布标签的源码树
        run: |
          git fetch --depth=1 origin "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}"
          git worktree add --detach "$RUNNER_TEMP/app" "refs/tags/${{ inputs.tag }}"
          echo "APP_DIR=$RUNNER_TEMP/app" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: ${{ runner.temp }}/app/pubspec.yaml
          architecture: x64
          cache: true
      - name: 取 pub 依赖并 precache 引擎产物
        env:
          PUB_CACHE: ${{ runner.temp }}/pub-cache
        run: |
          cd "$APP_DIR"
          flutter pub get --enforce-lockfile
          FLUTTER_ROOT=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          # 沙箱里的 flutter build 会给 SDK 自己的 tools 树跑一次 pub get --example，
          # 所以现在（有网）就把那棵树的依赖灌进缓存，离线解析才有料可用。
          "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" pub get \
            --directory "$FLUTTER_ROOT/packages/flutter_tools" --example
          # cargokit 的 build_tool 在构建期会现写一个 runner 包再 pub get，同样要有缓存。
          ( cd "$APP_DIR/packages/rhttp/cargokit/build_tool" && dart pub get )
          # 每个第三方插件都自带一份 cargokit，构建期会现跑 `dart pub get`。
          # 发布标签里的那份还不认识 CARGOKIT_PUB_OFFLINE，沙箱无网就会 socket 报错，
          # 所以先把缓存里的脚本改成 --offline，再把各 build_tool 的依赖（有网时）灌进缓存。
          CARGOKIT_SCRIPTS=$(find "$PUB_CACHE" -name run_build_tool.sh -path '*cargokit*')
          test -n "$CARGOKIT_SCRIPTS" || { echo "::error::缓存里找不到 cargokit 的 run_build_tool.sh"; exit 1; }
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch_cargokit_offline.py" $CARGOKIT_SCRIPTS
          for tool_dir in $(find "$PUB_CACHE" -type d -name build_tool -path '*cargokit*'); do
            warm="$RUNNER_TEMP/cargokit-warm"
            rm -rf "$warm"
            mkdir -p "$warm/bin"
            {
              echo "name: build_tool_runner"
              echo "version: 1.0.0"
              echo "publish_to: none"
              echo "environment:"
              echo "  sdk: '>=3.0.0 <4.0.0'"
              echo "dependencies:"
              echo "  build_tool:"
              echo "    path: \"$tool_dir\""
            } > "$warm/pubspec.yaml"
            echo "void main() {}" > "$warm/bin/build_tool_runner.dart"
            ( cd "$warm" && dart pub get --no-precompile )
          done
          "$FLUTTER_ROOT/bin/flutter" precache --linux
          # flutter_onnxruntime 的 linux 插件在 CMake 配置期直接 file(DOWNLOAD) 拉 ONNX Runtime，
          # 离线沙箱里既下不动也不会报错，最后只留一句“解压目录不存在”。这里按插件自己的默认版本
          # 预先下好并解压，一起塞进 engine-artifacts 归档，沙箱里再把它放回插件期望的位置。
          ORT_PLUGIN_FILE=$(ls -d "$PUB_CACHE"/hosted/*/flutter_onnxruntime-*/linux/CMakeLists.txt | head -1)
          test -n "$ORT_PLUGIN_FILE" || { echo "::error::找不到 flutter_onnxruntime 的 linux/CMakeLists.txt"; exit 1; }
          ORT_VERSION=$(sed -n 's/.*set(ONNXRUNTIME_VERSION "\([0-9.]*\)").*/\1/p' "$ORT_PLUGIN_FILE" | head -1)
          echo "ONNX Runtime version: ${ORT_VERSION}"
          test -n "$ORT_VERSION" || { echo "::error::解析不出 ONNXRUNTIME_VERSION"; exit 1; }
          ORT_STAGE="$RUNNER_TEMP/ort-stage"
          mkdir -p "$ORT_STAGE/onnxruntime"
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            | tar xz -C "$ORT_STAGE/onnxruntime"
          test -f "$ORT_STAGE/onnxruntime/onnxruntime-linux-x64-${ORT_VERSION}/include/onnxruntime_cxx_api.h" || {
            echo "::error::ONNX Runtime 解压后没有头文件"; exit 1;
          }
          # pdfium_dart 的 linux hook 在构建期直接用 HTTP 拉 pdfium 归档，离线沙箱里同样没有救。
          # 这里把它改成优先使用 PDFIUM_PREBUILT 指向的本地库（幂等），再把库一起塞进归档。
          PDFIUM_HOOK=$(ls -d "$PUB_CACHE"/hosted/*/pdfium_dart-*/hook/build.dart | head -1)
          test -n "$PDFIUM_HOOK" || { echo "::error::找不到 pdfium_dart 的 hook/build.dart"; exit 1; }
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch_pdfium_hook.py" "$PDFIUM_HOOK"
          PDFIUM_STAGE="$RUNNER_TEMP/pdfium-stage"
          mkdir -p "$PDFIUM_STAGE/pdfium/lib" "$RUNNER_TEMP/pdfium-extract"
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz" \
            | tar xz -C "$RUNNER_TEMP/pdfium-extract" lib/libpdfium.so
          cp "$RUNNER_TEMP/pdfium-extract/lib/libpdfium.so" "$PDFIUM_STAGE/pdfium/lib/libpdfium.so"
          test -f "$PDFIUM_STAGE/pdfium/lib/libpdfium.so" || { echo "::error::pdfium 解压后没有库文件"; exit 1; }
          # sqlite3 的 hook 同样会去 GitHub Releases 拉预编译库：改成优先用 SQLITE3_PREBUILT。
          SQLITE3_HOOKS=$(ls -d "$PUB_CACHE"/hosted/*/sqlite3-*/lib/src/hook/compile/description.dart)
          test -n "$SQLITE3_HOOKS" || { echo "::error::找不到 sqlite3 的 hook/compile/description.dart"; exit 1; }
          # 缓存里可能同时有几个 sqlite3 版本，离线解析出哪个都要能命中，所以逐个打。
          for hook in $SQLITE3_HOOKS; do
            python3 "$GITHUB_WORKSPACE/.github/scripts/patch_sqlite3_hook.py" "$hook" /app/sqlite3
          done
          SQLITE3_STAGE="$RUNNER_TEMP/sqlite3-stage"
          python3 "$GITHUB_WORKSPACE/.github/scripts/stage_sqlite3_asset.py" "$PUB_CACHE" "$SQLITE3_STAGE"
          tar czf "$RUNNER_TEMP/pub-cache.tar.gz" -C "$RUNNER_TEMP" pub-cache
          tar czf "$RUNNER_TEMP/engine-artifacts.tar.gz" -C "$FLUTTER_ROOT/bin/cache" artifacts \
            -C "$ORT_STAGE" onnxruntime -C "$PDFIUM_STAGE" pdfium -C "$SQLITE3_STAGE" sqlite3
      - name: 准备 Rust 工具链并 vendor
        env:
          PUB_CACHE: ${{ runner.temp }}/pub-cache
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/prepare_rust_toolchain.py"
          cd "$APP_DIR/packages/rhttp/rust"
          cargo vendor vendor > "$RUNNER_TEMP/vendor-config.txt"
          # 插件自带的 Rust crate 也要一起 vendor：super_native_extensions 的 Cargo.lock 钉了
          # 一个 git 源分支上的 mime_guess，沙箱离线时 cargo 没地方 clone，插件编译就断在那里。
          VENDOR_DIR="$APP_DIR/packages/rhttp/rust/vendor"
          : > "$RUNNER_TEMP/plugin-vendor-config.txt"
          PLUGIN_CRATES=$(find "$PUB_CACHE" -maxdepth 4 -name Cargo.toml -path '*/rust/Cargo.toml' -not -path '*/target/*')
          test -n "$PLUGIN_CRATES" || { echo "::error::缓存里找不到插件的 rust/Cargo.toml"; exit 1; }
          for manifest in $PLUGIN_CRATES; do
            crate_dir=$(dirname "$manifest")
            echo "vendoring plugin crate: $crate_dir"
            ( cd "$crate_dir" && cargo vendor --no-delete "$VENDOR_DIR" ) >> "$RUNNER_TEMP/plugin-vendor-config.txt"
          done
          python3 "$GITHUB_WORKSPACE/.github/scripts/merge_vendor_config.py" \
            "$RUNNER_TEMP/vendor-config-merged.txt" \
            "$RUNNER_TEMP/vendor-config.txt" "$RUNNER_TEMP/plugin-vendor-config.txt"
          STAGE="$RUNNER_TEMP/cargo-stage"
          mkdir -p "$STAGE"
          mv vendor "$STAGE/vendor"
          cp "$RUNNER_TEMP/vendor-config-merged.txt" "$STAGE/vendor-config.toml"
          tar czf "$RUNNER_TEMP/cargo-vendor.tar.gz" -C "$STAGE" .
      - name: 归一到带版本的归档名
        run: |
          cd "$RUNNER_TEMP"
          for name in pub-cache engine-artifacts cargo-vendor; do
            mv "$name.tar.gz" "$name-${{ inputs.tag }}.tar.gz"
          done
          ls -la ./*.tar.gz
      - name: 渲染 manifest
        run: |
          python3 .github/scripts/render_flatpak_manifest.py \
            --tag "${{ inputs.tag }}" \
            --release-base "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}" \
            --pub-cache "$RUNNER_TEMP/pub-cache-${{ inputs.tag }}.tar.gz" \
            --engine-artifacts "$RUNNER_TEMP/engine-artifacts-${{ inputs.tag }}.tar.gz" \
            --cargo-vendor "$RUNNER_TEMP/cargo-vendor-${{ inputs.tag }}.tar.gz"
      - name: 收进同一个目录再上传
        # 五个文件散在两个根下，upload-artifact 会按最小公共父目录保留路径；
        # 先摊平到一个目录，消费方拿到的就是干净的一层。
        run: |
          mkdir -p "$RUNNER_TEMP/flatpak"
          cp "$RUNNER_TEMP"/*.tar.gz flatpak/io.github.venera.unified.yml flatpak/flutter-sha256.json "$RUNNER_TEMP/flatpak/"
          ls -la "$RUNNER_TEMP/flatpak"
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak_vendor
          path: ${{ runner.temp }}/flatpak
          if-no-files-found: error
          retention-days: 14
      - name: 传上 Release
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            "$RUNNER_TEMP/pub-cache-${{ inputs.tag }}.tar.gz" \
            "$RUNNER_TEMP/engine-artifacts-${{ inputs.tag }}.tar.gz" \
            "$RUNNER_TEMP/cargo-vendor-${{ inputs.tag }}.tar.gz" \
            flatpak/io.github.venera.unified.yml \
            --clobber
      - name: 小结
        run: |
          {
            echo "### Flatpak 离线依赖归档"
            echo
            echo "- 标签：\`${{ inputs.tag }}\`"
            echo "- manifest：\`flatpak/io.github.venera.unified.yml\`（已渲染，可直接 flatpak-builder）"
            echo
            echo '```'
            sha256sum "$RUNNER_TEMP"/*.tar.gz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
