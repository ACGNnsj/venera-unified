name: F-Droid 自建仓

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已发布的标签，例如 v1.20.0（取其中的 APK）"
        required: true
        type: string
      asset:
        description: "Release 里 APK 资产名的通配符。默认 universal 包；它超过 GitHub 单文件 100 MiB 上限时，改填 *-android-arm64-v8a.apk"
        required: false
        default: "*-android.apk"
        type: string

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

permissions:
  contents: write
  pages: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 校验仓库签名 secrets
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$FDROID_KEYSTORE_B64" ] || missing="$missing FDROID_KEYSTORE_B64"
          [ -n "$FDROID_KEYSTORE_PASS" ] || missing="$missing FDROID_KEYSTORE_PASS"
          [ -n "$FDROID_KEY_ALIAS" ] || missing="$missing FDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing"
            echo "F-Droid 自建仓用一套独立的仓库签名密钥，不是 Android 应用的签名证书；"
            echo "缺这三个 secret 时 base64 --decode 只会产出空 jks，要到 fdroid update 才报错，"
            echo "所以这里提前拦下：先按 doc/distribution/fdroid.zh.md 生成仓库签名密钥并配好 secrets。"
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: 下载 APK 并检查体积
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p newapk
          gh release download "${{ inputs.tag }}" --pattern "${{ inputs.asset }}" --dir newapk
          ls -l newapk
          # GitHub 对分支上的单个文件有 100 MiB 硬上限，超过就整个 push 被拒；
          # universal 包目前 130–155 MB，所以在推之前先拦住并说清楚换哪个资产。
          for apk in newapk/*.apk; do
            size=$(stat -c %s "$apk")
            echo "$apk: $size 字节"
            if [ "$size" -gt 104857600 ]; then
              echo "::error::$(basename "$apk") 有 $size 字节，超过 GitHub 单文件 100 MiB 上限，push 到 gh-pages 会被拒。"
              echo "把 asset 输入改成 *-android-arm64-v8a.apk（约 56 MB）之类的分 ABI 包，或先给 universal 包瘦身。"
              exit 1
            fi
          done
      - name: 解析仓库对外地址
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pages 的对外地址可能与 <owner>.github.io/<repo> 不同：账号级自定义域会把
          # github.io 跳转到自定义域，而 F-Droid 索引里的 repo address 必须写客户端真正
          # 请求的那个地址，所以先问 Pages API，问不到（还没开启）才退回 github.io。
          html=""
          html=$(gh api "repos/${{ github.repository }}/pages" --jq '.html_url' 2>/dev/null || true)
          if [ -z "$html" ] || [ "$html" = "null" ]; then
            owner=$(echo "${{ github.repository }}" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
            name=$(echo "${{ github.repository }}" | cut -d/ -f2)
            html="https://${owner}.github.io/${name}/"
          fi
          base="${html/http:/https:}"
          base="${base%/}"
          echo "repo_url=${base}/fdroid/repo" >> "$GITHUB_OUTPUT"
          echo "索引地址 ${base}/fdroid/repo"
      - name: 取回已发布的仓内容
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "$remote" site
          else
            # 首次运行时 gh-pages 还不存在：起一个孤儿分支，否则后面 git commit 会因为
            # site 不是 git 仓库而报 not a git repository
            echo "gh-pages 不存在，创建孤儿分支"
            mkdir -p site
            git -C site init --quiet
            git -C site checkout --quiet --orphan gh-pages
            git -C site remote add origin "$remote"
          fi
          mkdir -p site/fdroid/repo site/fdroid/metadata
      - name: 安装 fdroidserver
        run: pip install fdroidserver
      - name: 生成索引
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          REPO_URL: ${{ steps.site.outputs.repo_url }}
        run: |
          cd site/fdroid
          echo "$FDROID_KEYSTORE_B64" | base64 --decode > fdroid-repo.jks
          # fdroidserver 2.x 只读 config.yml，config.py 会被忽略（日志里只有一行
          # WARNING: Ignoring deprecated config.py），随后按默认 keystore.p12 去找，
          # 于是报 repo_keyalias/keystore.p12/keystorepass/keypass 全缺。
          # 用 JSON 写 config.yml（YAML 是 JSON 的超集），密码里的引号、冒号、# 不会被 YAML 解析吃掉。
          python3 - <<'PY'
          import json
          import os

          config = {
              "repo_url": os.environ["REPO_URL"],
              "repo_name": "VeneraUnified",
              "repo_description": "VeneraUnified comic reader",
              "repo_keyalias": os.environ["FDROID_KEY_ALIAS"],
              "keystore": "fdroid-repo.jks",
              "keystorepass": os.environ["FDROID_KEYSTORE_PASS"],
              "keypass": os.environ["FDROID_KEYSTORE_PASS"],
          }
          with open("config.yml", "w", encoding="utf-8") as handle:
              json.dump(config, handle)
          PY
          chmod 600 config.yml
          cp ../../newapk/*.apk repo/
          # 仓库里维护一份完整的 metadata（名称/摘要/描述/许可证），覆盖 gh-pages 上
          # --create-metadata 生成的空骨架，否则客户端里只有包名、没有简介。
          if [ -d ../../fdroid/metadata ]; then
            cp -f ../../fdroid/metadata/*.yml metadata/
          fi
          # 没有 metadata 时 fdroid update 只警告一句就跳过，索引里 numPackages=0；
          # -c 会为缺 metadata 的包生成骨架（之后随 gh-pages 提交留存），本次与后续都能索引到。
          fdroid update --create-metadata
          rm -f fdroid-repo.jks config.yml
      - name: 推回 gh-pages
        run: |
          cd site
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "fdroid repo: ${{ inputs.tag }}" || exit 0
          git push origin gh-pages
