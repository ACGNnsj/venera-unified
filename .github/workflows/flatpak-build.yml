name: Flatpak 离线构建验证

# 手工档：拿 flatpak-vendor.yml 挂到 Release 上的三份归档与渲染后的 manifest，
# 在真实 flatpak-builder 里做一次联网预热 + 一次 --disable-download 复建，再用 xvfb 起窗口做烟测。
# 结论只影响本 job，不参与发版门控。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已跑过 Flatpak 离线依赖归档的标签，例如 v1.20.0"
        required: true
        type: string
      source:
        description: "从 Release 取，还是从某次归档工作流运行的产物取"
        required: false
        default: release
        type: choice
        options:
          - release
          - artifact
      run_id:
        description: "source=artifact 时填归档工作流的 run id"
        required: false
        default: ""
        type: string

concurrency:
  group: flatpak-build-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: 取 Release 上的归档与 manifest
        if: ${{ inputs.source == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.tag }}" \
            --pattern '*.tar.gz' \
            --pattern 'io.github.venera.unified.yml' \
            --dir dist
          ls -la dist
      - name: 取归档工作流的产物
        if: ${{ inputs.source == 'artifact' }}
        uses: actions/download-artifact@v8
        with:
          name: flatpak_vendor
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: 摊平并核对拿到的文件
        run: |
          find dist -mindepth 2 -type f -exec cp -f {} dist/ \;
          find dist -mindepth 1 -type d | sort -r | xargs -r rm -rf
          ls -la dist
          test -f dist/io.github.venera.unified.yml || {
            echo "::error::Release ${{ inputs.tag }} 上没有 io.github.venera.unified.yml，先跑 Flatpak 离线依赖归档"
            exit 1
          }
      - name: 安装 flatpak-builder 与运行时
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb python3-yaml
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # 这一拉就是 2GB 上下，flathub 的静态增量偶尔会卡住整步不动；拆成多次、加超时与重试，
          # 失败时才有明确报错而不是一直挂到 job 超时。
          refs="org.gnome.Sdk//48 org.gnome.Platform//48 org.freedesktop.Sdk.Extension.rust-stable//24.08 org.freedesktop.Sdk.Extension.llvm18//24.08"
          for i in 1 2 3; do
            if timeout 900 flatpak install --user -y --noninteractive --no-static-deltas flathub $refs; then
              break
            fi
            echo "::warning::flatpak install 第 $i 次失败，重试"
          done
          flatpak info --user org.gnome.Sdk//48 > /dev/null
          flatpak info --user org.freedesktop.Sdk.Extension.llvm18//24.08 > /dev/null
          flatpak --version && flatpak-builder --version
      # artifact 演练时归档就在 dist/ 里，把 manifest 的三份 URL 源改成同目录相对路径，
      # 这样不往 Release 传 1GB 归档也能真跑一遍；source=release 则保持 URL 源，验线上接线。
      - name: 演练时把归档源改成本地路径
        if: ${{ inputs.source == 'artifact' }}
        run: |
          python3 - <<'PY'
          import pathlib, yaml
          p = pathlib.Path('dist/io.github.venera.unified.yml')
          m = yaml.safe_load(p.read_text(encoding='utf-8'))
          names = ('pub-cache', 'cargo-vendor', 'engine-artifacts')
          hits = 0
          for mod in m.get('modules', []):
              for src in mod.get('sources', []) or []:
                  if src.get('type') == 'archive' and 'url' in src:
                      base = src['url'].rsplit('/', 1)[-1]
                      if any(n in base for n in names):
                          src.pop('url')
                          src['path'] = base
                          hits += 1
          p.write_text(yaml.safe_dump(m, allow_unicode=True, sort_keys=False), encoding='utf-8')
          print('rewrote', hits, 'archive sources')
          assert hits == 3, 'expected three archive sources'
          PY
          ls -la dist/*.tar.gz
      # flatpak-builder 没有 --offline：联网预热那次把源都下进缓存，
      # 第二次用 --disable-download 复用缓存、不许再下载，等价于离线复建。
      - name: 联网预热构建
        run: |
          set -o pipefail
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=repo builddir dist/io.github.venera.unified.yml 2>&1 | tee prewarm.log
      - name: 无下载复建（--disable-download）
        run: |
          set -o pipefail
          flatpak-builder --user --install --force-clean --disable-rofiles-fuse --disable-download --repo=repo builddir dist/io.github.venera.unified.yml 2>&1 | tee offline.log
      - name: 启动烟测
        run: |
          set +e
          flatpak list --user --app --columns=application,version
          # flatpak-builder 用 --user 装,flatpak run 也必须带 --user,否则去系统安装里找
          xvfb-run -a timeout 60 flatpak run --user io.github.venera.unified > smoke.log 2>&1
          code=$?
          echo "exit=$code"
          if [ $code -eq 124 ]; then
            echo "::notice::应用在 60 秒内保持运行，未立即崩溃"
          fi
          if grep -qE 'error while loading shared libraries|Failed to load|cannot open shared object' smoke.log; then
            echo "::error::启动时缺共享库"
            exit 1
          fi
          if [ $code -ne 124 ] && [ $code -ne 0 ]; then
            echo "::error::应用提前退出，退出码 $code"
            cat smoke.log
            exit 1
          fi
          tail -50 smoke.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flatpak_build_logs
          path: |
            prewarm.log
            offline.log
            smoke.log
          if-no-files-found: warn
          retention-days: 14
      - name: 小结
        if: always()
        run: |
          {
            echo "### Flatpak 构建验证（${{ inputs.tag }}）"
            echo
            echo "- 联网预热：$(grep -c 'Building' prewarm.log 2>/dev/null || echo 0) 个模块步骤"
            echo "- 离线复建：$(test -f offline.log && echo 已执行 || echo 未执行)"
            echo "- 烟测：$(tail -1 smoke.log 2>/dev/null | cut -c1-200)"
          } >> "$GITHUB_STEP_SUMMARY"
