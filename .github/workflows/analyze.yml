name: "代码分析"
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    # 只影响 push 触发：纯文档/票面改动不必拖起 20 分钟的 Flutter 测试。
    # workflow_call（「完整构建」的质量门）与 pull_request 不受影响，发版前照常全量跑。
    paths-ignore:
      - 'docs/**'
      - '.scratch/**'
      - '**/*.md'

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  rhttp-native:
    name: Rhttp 原生回调生命周期
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # mold 链接大 cdylib 比 GNU ld 快；debug=0 让链接更快、target 目录小一半。
      # 两个都只改变构建产物形态，不改变测试语义——唯一代价是失败时栈里没有行号。
      RUSTFLAGS: --cfg reqwest_unstable -C link-arg=-fuse-ld=mold
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - name: 安装 mold 链接器
        run: sudo apt-get update -y && sudo apt-get install -y mold
      # 实测：冷缓存 203s→热缓存 16s，job 从 4m 降到 40s。
      # 只缓存本 crate 的 target，只在 main 回写，避免 PR 分支挤掉仓库 10GB 配额。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rhttp/rust
          key: linux-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 验证锁定原生源码的取消与回调收尾
        run: cargo test --locked --manifest-path packages/rhttp/rust/Cargo.toml --lib
      - name: 编译 Flutter 测试使用的 Rhttp 库
        run: cargo build --locked --manifest-path packages/rhttp/rust/Cargo.toml --lib
      - name: 验证 uniffi 绑定的请求映射与流式行为
        run: cargo test --locked --manifest-path packages/rhttp/rust/Cargo.toml -p rhttp-uniffi
      - uses: actions/upload-artifact@v7
        with:
          name: linux-rhttp-test-library
          path: packages/rhttp/rust/target/debug/librhttp.so
          if-no-files-found: error
          retention-days: 1

  rhttp-android:
    name: Android Rhttp 交叉目标（${{ matrix.target }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            clang: aarch64-linux-android24-clang
          - target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi24-clang
          - target: x86_64-linux-android
            clang: x86_64-linux-android24-clang
    env:
      RUSTFLAGS: --cfg reqwest_unstable
    steps:
      - uses: actions/checkout@v7
      - name: 准备与 Android 工程一致的 NDK
        run: |
          set -euo pipefail
          ndk_version="$(grep -oP 'ndkVersion\s*"\K[^"]+' android/app/build.gradle)"
          ndk_root="${ANDROID_HOME}/ndk/${ndk_version}"
          if [[ ! -d "${ndk_root}" ]]; then
            echo "安装 NDK ${ndk_version}"
            # sdkmanager 退出后 yes 会被 SIGPIPE 打断（141），pipefail 下这会把整条管道判成失败，
            # 所以只在这一行关掉 pipefail；sdkmanager 自己的退出码仍然生效。
            set +o pipefail
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ndk_version}" > /dev/null
            set -o pipefail
          fi
          if [[ ! -d "${ndk_root}" ]]; then
            echo "::error::NDK ${ndk_version} 没有装到 ${ndk_root}"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=${ndk_root}" >> "$GITHUB_ENV"
      - name: 交叉编译 rhttp-uniffi
        env:
          TARGET: ${{ matrix.target }}
          CLANG: ${{ matrix.clang }}
        run: |
          set -euo pipefail
          toolchain="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # 这两个后缀大小写不一样，别合并：cc-rs 只认小写的 CC_<target 下划线化>
          # （CC_aarch64_linux_android），cargo 的链接器变量要全大写
          # （CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER）。
          cc_suffix="$(printf '%s' "${TARGET}" | tr '-' '_')"
          cargo_suffix="$(printf '%s' "${TARGET}" | tr 'a-z-' 'A-Z_')"
          export "CC_${cc_suffix}=${toolchain}/${CLANG}"
          export "AR_${cc_suffix}=${toolchain}/llvm-ar"
          export "CARGO_TARGET_${cargo_suffix}_LINKER=${toolchain}/${CLANG}"
          cargo build --locked --manifest-path packages/rhttp/rust/Cargo.toml \
            -p rhttp-uniffi --lib --release --target "${TARGET}"
      - name: 检查产物
        run: |
          set -euo pipefail
          library="packages/rhttp/rust/target/${{ matrix.target }}/release/librhttp_uniffi.so"
          test -s "${library}"
          file "${library}"
          file "${library}" | grep -q "ELF"

  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: python3 .github/scripts/release_version.py --check
      - run: python3 .github/scripts/check_structure_imports.py
      - run: python3 .github/scripts/check_architecture_dependencies.py
      - run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py"
      - run: flutter pub get --enforce-lockfile
      - name: 准备并验证独立代码审查工具
        working-directory: tool/code_audit
        run: |
          dart pub get --enforce-lockfile
          dart run bin/self_check.dart
          dart analyze --fatal-infos
      - run: dart tool/check_git_dependencies.dart
      - name: 检查本次修改的 Dart 格式
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ -n "${BASE_SHA:-}" ]]; then
            diff_range="${BASE_SHA}...HEAD"
          else
            diff_range="HEAD^...HEAD"
          fi
          mapfile -t dart_files < <(git diff --diff-filter=ACMRTUXB --name-only "$diff_range" -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo "本次没有修改 Dart 文件。"
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"
      - run: flutter analyze --fatal-infos --fatal-warnings

  flutter-tests:
    # 分片并行：test_core 按套件把用例切成连续切片，每片仍加载全部测试文件。
    # 分片数写死在两处、必须一致：matrix.shard 的列表长度 == TOTAL_SHARDS。
    name: Flutter 测试与覆盖率（分片 ${{ matrix.shard }}/2）
    needs: [rhttp-native, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TOTAL_SHARDS: "2"
    strategy:
      # 一片红了立刻掐掉另一片，别让人多等半小时。
      fail-fast: true
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: linux-rhttp-test-library
          path: build/test-native/lib
      - name: 准备 Linux 原生测试库
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
          python3 .github/scripts/prepare_linux_test_libraries.py
      - name: 跑分片测试
        run: >-
          flutter test --coverage
          --coverage-path=coverage/lcov-shard-${{ matrix.shard }}.info
          --total-shards "$TOTAL_SHARDS"
          --shard-index ${{ matrix.shard }}
          --fail-fast
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/test-native/lib
      - name: 上传分片覆盖率
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage-shard-${{ matrix.shard }}
          path: coverage/lcov-shard-${{ matrix.shard }}.info
          if-no-files-found: error
          retention-days: 14

  coverage-summary:
    # 分片各写一份 lcov，这里按「同一行取较大命中数」合并；
    # 直接拼接会把两片都覆盖到的行算两次、覆盖率被算高。
    name: Dart 覆盖率汇总
    needs: flutter-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dart-coverage-shard-*
          path: coverage-shards
          merge-multiple: true
      - name: 合并分片覆盖率
        run: python3 .github/scripts/merge_dart_coverage.py coverage/lcov.info coverage-shards/*.info
      - name: 汇总 Dart 覆盖率
        run: python3 .github/scripts/report_dart_coverage.py coverage/lcov.info --github-summary
      - name: 上传 Dart 覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
